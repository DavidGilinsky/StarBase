<!doctype html>
<!--
  Author:        David Gilinsky
  File:          web/index.html
  Purpose:       StarBase web UI shell: dashboard, browse, the query builder with
                 saved queries and an actions bar (stage / WBPP / export / fsop),
                 the jobs ledger, and the frame detail drawer. Static SPA against
                 /api/v1, vanilla JS, no build step.
  Created:       2026-07-24
  Last Modified: 2026-07-25

  License:       GPL-3.0-or-later
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarBase</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <h1>Star<span>Base</span></h1>
    <nav>
      <button data-view="dashboard" class="active">Dashboard</button>
      <button data-view="browse">Browse</button>
      <button data-view="query">Query</button>
      <button data-view="jobs">Jobs</button>
      <button data-view="roots">Roots</button>
      <button data-view="tags">Tags</button>
      <button data-view="database">Database</button>
      <button data-view="equipment">Equipment</button>
      <button data-view="users">Users</button>
      <button data-view="server">Server</button>
    </nav>
    <span class="spacer"></span>
    <span id="account" class="account"></span>
    <span id="conn" class="conn"></span>
  </header>
  <main id="app"></main>
  <div id="detail" class="drawer hidden"></div>
  <script src="/js/app.js"></script>
</body>
</html>
